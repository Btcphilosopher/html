<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SilicaFlux Albion · Engineering Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1426; --navy-deep:#070D1A; --panel:#111C30; --panel-2:#16233A; --line:#24324A; --steel:#3A4A63;
  --muted:#8C97A8; --ivory:#E9E2CF; --ivory-2:#BDB6A4; --gold:#C9A84C; --cyan:#00E5FF;
  --m-meas:#0FA0BA; --m-theo:#A8893A; --good:#3FB27F; --warn:#D9A441; --crit:#E0605A;
  --display:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;
  --mono:'DM Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--navy-deep);color:var(--ivory);font:13px/1.55 var(--mono);
  background-image:linear-gradient(rgba(58,74,99,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(58,74,99,.16) 1px,transparent 1px);
  background-size:32px 32px;}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:22px 28px 14px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(11,20,38,.96),rgba(7,13,26,.92));position:sticky;top:0;z-index:5}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .kicker{font-size:11px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
.brand h1{margin:0;font:400 38px/1 var(--display);letter-spacing:.06em;color:var(--ivory)}
.brand h1 b{color:var(--cyan);font-weight:400}
.meta{text-align:right;color:var(--muted);font-size:11px;line-height:1.7}
.meta span{color:var(--ivory-2)}
.layout{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 92px)}
nav{border-right:1px solid var(--line);padding:18px 0;background:rgba(7,13,26,.7)}
nav button{all:unset;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:8px 22px;cursor:pointer;
  color:var(--ivory-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-left:2px solid transparent}
nav button .n{color:var(--steel);font-size:10px;width:18px}
nav button:hover{color:var(--ivory);background:rgba(36,50,74,.35)}
nav button[aria-current=page]{color:var(--ivory);border-left-color:var(--gold);background:linear-gradient(90deg,rgba(201,168,76,.12),transparent)}
nav button:focus-visible{outline:1px solid var(--cyan);outline-offset:-1px}
nav .sep{margin:12px 22px 6px;font-size:10px;letter-spacing:.3em;color:var(--steel)}
main{padding:24px 30px 60px;max-width:1280px}
main:focus{outline:none}
h2{font:400 30px/1.1 var(--display);letter-spacing:.06em;margin:0 0 4px;color:var(--ivory)}
h3{font:400 18px/1.2 var(--display);letter-spacing:.08em;margin:22px 0 10px;color:var(--gold)}
.sub{color:var(--muted);margin:0 0 18px;max-width:900px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.badge{font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--steel);color:var(--ivory-2)}
.badge.sim{border-color:var(--m-meas);color:#7fd8e8}.badge.theo{border-color:var(--m-theo);color:#d9c389}
.badge.synth{border-color:var(--ivory-2)}.badge.fpga{border-color:var(--steel)}
.badge.na{border-color:var(--crit);color:#f1a29d}.badge.hyp{border-color:var(--warn);color:#ecc77a}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}.layout{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;padding:6px}nav button{width:auto;padding:6px 10px}nav .sep{display:none}}
.card{background:linear-gradient(180deg,var(--panel),rgba(17,28,48,.88));border:1px solid var(--line);padding:16px 18px;position:relative}
.card::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--gold);border-top:2px solid var(--gold)}
.tile .k{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:400 40px/1.05 var(--display);letter-spacing:.03em;color:var(--ivory);margin-top:6px}
.tile .v small{font:400 13px var(--mono);color:var(--ivory-2);margin-left:6px;letter-spacing:0}
.tile .d{font-size:11px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:400;color:var(--muted);font-size:10px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--steel);padding:7px 8px}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(36,50,74,.3)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em}
.st i{display:inline-block;width:8px;height:8px;border-radius:50%}
.st.pass i{background:var(--good)}.st.fail i{background:var(--crit)}.st.na i{background:transparent;border:1px solid var(--crit)}.st.warn i{background:var(--warn)}
.na-panel{border:1px dashed rgba(224,96,90,.55);padding:22px;background:repeating-linear-gradient(135deg,rgba(224,96,90,.05) 0 10px,transparent 10px 20px)}
.na-panel .big{font:400 26px var(--display);letter-spacing:.08em;color:#f1a29d}
.legend{display:flex;gap:16px;font-size:11px;color:var(--ivory-2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
details{margin-top:8px}summary{cursor:pointer;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#tip{position:fixed;pointer-events:none;background:#0A1222;border:1px solid var(--steel);padding:7px 10px;font-size:11px;color:var(--ivory);display:none;z-index:20;max-width:340px}
#tip b{color:var(--gold);font-weight:400}
svg text{font-family:var(--mono)}
.mono-muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);padding:2px 8px;font-size:11px;color:var(--ivory-2)}
.tree td:first-child{white-space:pre}
footer{color:var(--steel);font-size:10px;letter-spacing:.2em;margin-top:30px;text-transform:uppercase}
</style>
</head>

    a.area += m.area_um2; a.cells += m.cells; a.flops += m.flops; a.inst += 1; a.delay = Math.max(a.delay, m.abc_delay_ps || 0);
  }
  return Object.values(agg).sort((a, b) => b.area - a.area);
}

    el('div', { class: 'grid g3' },
      el('div', { class: 'card tile' }, el('div', { class: 'k' }, 'Post-route Fmax (estimate)'), el('div', { class: 'v' }, fmt(Math.min(...Object.values(f.fmax_mhz)), 2), el('small', {}, 'MHz')), el('div', { class: 'd' }, status(f.timing_met === true, f.timing_met ? `meets ${f.target_mhz} MHz` : `target ${f.target_mhz} MHz NOT met`))),
      el('div', { class: 'card tile' }, el('div', { class: 'k' }, 'Board programmed'), el('div', { class: 'v', style: 'font-size:22px;margin-top:14px' }, status('na', 'NO')), el('div', { class: 'd' }, 'no compatible board available')),
      el('div', { class: 'card tile' }, el('div', { class: 'k' }, 'Host transfers on FPGA'), el('div', { class: 'v', style: 'font-size:22px;margin-top:14px' }, status('na', 'NONE')), el('div', { class: 'd' }, 'board-specific host bridge not built'))),
    el('h3', {}, 'Critical path'),
    el('div', { class: 'card' }, (f.critical_paths || []).length ? table([{ h: 'Delay ns', num: true, k: 'delay_ns' }, { h: 'Blocks crossed', f: c => c.modules.join(' → ') }], f.critical_paths) : '—',
      el('p', { class: 'mono-muted' }, 'The same-cycle response→request chaining that gives the DMA its 4 B/cycle (BRAM read → SECDED decode → fabric response → DMA re-issue → arbitration → MMIO register write enable) is the longest path. Planned fix: registered SECDED stage on SRAM responses and a registered MMIO request stage, with two outstanding DMA requests to keep throughput.')),
    el('h3', {}, 'Utilisation'),
    el('div', { class: 'card' }, barChart({ rows: u.map(r => ({ label: `${r.k} (${fmtN(r.used)}/${fmtN(r.avail)})`, values: [r.pct] })), series: [{ name: 'used', color: 'var(--m-meas)' }], unit: '%', max: 100 })),
    el('p', { class: 'mono-muted' }, f.caveats.join(' · '))];
}, 'IMPLEMENTATION');

view('history', 'Benchmark history', () => {
  const h = D.bench_history || [];
  const pick = (b, n) => { const m = (b.metrics || []).find(x => x.name === n); return m ? fmt(m.value, 3) : '—'; };
  return [el('h2', {}, 'Benchmark history'), badges('simulation'),
    el('p', { class: 'sub' }, 'Every AlbionBench run appends to reports/bench/history.jsonl with its Git revision and tool versions.'),
    el('div', { class: 'card' }, table([
      { h: 'Timestamp', k: 'timestamp' }, { h: 'Rev', f: b => b.provenance.git_rev }, { h: 'Config', k: 'config' },
      { h: 'Cross-bank B/c', num: true, f: b => pick(b, 'SRAM->SRAM copy, cross-bank') },
      { h: 'Host L=1 B/c', num: true, f: b => pick(b, 'host->SRAM, host latency 1') },
      { h: 'Host L=16 B/c', num: true, f: b => pick(b, 'host->SRAM, host latency 16') },
      { h: 'PING cycles', num: true, f: b => pick(b, 'PING round trip (median of 16)') }], h.slice().reverse()))];
}, 'IMPLEMENTATION');

view('verification', 'Verification', () => {
  const t = tests();
  const suites = {};
  t.forEach(r => { const s = suites[r.suite] || (suites[r.suite] = { pass: 0, fail: 0 }); r.status === 'pass' ? s.pass++ : s.fail++; });
  const cov = D.coverage;
  return [el('h2', {}, 'Verification'), badges('simulation', 'formal'),
    el('div', { class: 'grid g4' }, Object.entries(suites).map(([k, v]) => el('div', { class: 'card tile' }, el('div', { class: 'k' }, k), el('div', { class: 'v' }, v.pass, el('small', {}, `pass · ${v.fail} fail`))))),
    el('h3', {}, 'Coverage by file (system tests, ALBION_MIN)'),
    el('div', { class: 'card' }, cov ? table([{ h: 'File', k: 'f' }, { h: 'Line %', num: true, f: r => fmt(r.d.line && r.d.line.percent, 1) }, { h: 'Branch %', num: true, f: r => fmt(r.d.branch && r.d.branch.percent, 1) }, { h: 'Toggle %', num: true, f: r => fmt(r.d.toggle && r.d.toggle.percent, 1) }], Object.entries(cov.files).map(([f, d]) => ({ f, d }))) : 'not collected'),
    el('h3', {}, 'All results'),
    el('div', { class: 'card' }, table([{ h: 'Suite', k: 'suite' }, { h: 'Test', k: 'name' }, { h: 'Status', f: r => status(r.status === 'pass') }, { h: 'Detail', k: 'detail' }], t))];
}, 'EVIDENCE');

view('deps', 'Dependencies', () => {
  const a = D.audit || { foundations: [], external_ip: [] };
  return [el('h2', {}, 'Repository audit'), badges('audit'),
    el('p', { class: 'sub' }, a._comment || ''),
    el('div', { class: 'card' }, table([{ h: 'P', k: 'project' }, { h: 'Foundation', k: 'name' }, { h: 'Role', k: 'role' }, { h: 'In repository', f: r => status(r.status === 'Missing' ? 'na' : true, r.status) },
      { h: 'P90-local stand-in', f: r => r.p90_local ? `${r.p90_local.module} — ${r.p90_local.status}` : (r.effect || 'none') }], a.foundations)),
    el('h3', {}, 'External IP and tools'),
    el('div', { class: 'card' }, table([{ h: 'Item', k: 'item' }, { h: 'Status', k: 'status' }, { h: 'Effect', k: 'effect' }], a.external_ip))];
}, 'EVIDENCE');

// ------------------------------------------------------------------ shell
function go(id) {
  const v = VIEWS.find(x => x.id === id) || VIEWS[0];
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === v.id ? 'page' : 'false'));
  const m = $('#main');
  m.replaceChildren(...[].concat(v.fn()), el('footer', {}, `SilicaFlux Albion · data generated ${D.generated} · every value from a recorded source or marked unavailable`));
  try { history.replaceState(null, '', '#' + v.id); } catch (e) { /* sandboxed preview */ }
  m.focus({ preventScroll: true });
}
function boot() {
  if (!D) { $('#main').append(el('p', {}, 'No data embedded. Run make albion-report.')); return; }
  const g = D.provenance.git || {};
  $('#meta').innerHTML = `rev <span>${g.short || '—'}${g.dirty ? '+' : ''}</span> · ${(D.bench && D.bench.config) || 'ALBION_MIN'}<br>generated <span>${D.generated}</span><br>${(D.provenance.tools || {}).verilator || ''}`;
  const nav = $('#nav');
  let grp = null, n = 0;
  VIEWS.forEach(v => {
    if (v.group !== grp) { grp = v.group; nav.append(el('div', { class: 'sep' }, grp)); }
    n++;
    nav.append(el('button', { 'data-id': v.id, onclick: () => go(v.id) }, el('span', { class: 'n' }, String(n).padStart(2, '0')), v.title));
  });
  let start = 'overview';
  try { start = (location.hash || '#overview').slice(1); } catch (e) { /* ignore */ }
  go(start);
  addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (h && VIEWS.some(v => v.id === h)) go(h); });
}
boot();
</script>
</body>
</html>
