<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Philosopher vs The System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#07080c;--ink:#e8e4d8;--dim:#8a8776;--gold:#C9A84C;--cyan:#00E5FF;--red:#ff4d5e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'DM Mono','Courier New',monospace}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.04em;margin:0}
#hud{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:min(600px,96vw)}
#hud b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:28px;color:var(--gold);letter-spacing:.04em}
#lv{color:var(--cyan);text-align:center}
#lives{color:var(--red);letter-spacing:3px}
#boss{width:min(600px,96vw);height:10px;border:1px solid var(--gold);margin-top:6px;display:none}
#bi{display:block;height:100%;background:linear-gradient(90deg,#ff6a00,var(--gold));transition:width .4s}
#stage{position:relative;width:min(600px,96vw,calc(100vh - 220px));aspect-ratio:1;margin-top:8px}
canvas{width:100%;height:100%;display:block;border:1px solid #2a2d3a;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:rgba(7,8,12,.88)}
#ov h2{font-size:clamp(34px,9vw,56px);color:var(--gold)}
#ov p{margin:0;max-width:44ch}
#ov small{color:var(--dim);max-width:44ch}
button{font:inherit;font-weight:500;background:var(--gold);color:#07080c;border:0;padding:10px 26px;cursor:pointer;margin-top:6px}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.help{width:min(600px,96vw);margin-top:10px;color:var(--dim);font-size:12px;text-align:center}
footer{margin-top:12px;font-size:11px;color:var(--dim);text-align:center;user-select:all}
footer code{color:var(--gold);word-break:break-all}
</style></head>
<body>
<div id="hud"><div>Score <b id="sc">0</b></div><div id="lv"></div><div>Lives <span id="lives"></span></div></div>
<div id="boss"><i id="bi"></i></div>
<div id="stage"><canvas id="c" width="600" height="600"></canvas><div id="ov"></div></div>
<div class="help" id="help"></div>
<div class="help">Arrow keys or WASD to move, or swipe. P pauses, M mutes.</div>
<footer>Support the game with Bitcoin donations: <code>bc1qk4r2kdev7t8qvfrsa767g7h63mj4526n0skkxm</code></footer>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),ov=$('ov'),T=20,N=30,PM=125;
const D=[[0,-1],[1,0],[0,1],[-1,0]];
const TY=[{n:'Tax Man',c:'#3ddc84'},{n:'Politician',c:'#ff4d5e'},{n:'Police',c:'#4d86ff'},{n:'Socialist',c:'#ffd23d'}];
const PL='Tax Man hunts you directly. Politician wanders and lunges. Police chase with the odd slip. Socialist coordinates and cuts you off.';
const blk=(x,y,w=1,h=1)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>0&&j>0&&i<N-1&&j<N-1)m[j][i]=1};
const LV=[
{n:'HMRC Office',c:'#C9A84C',ms:195,d:'A clean grid and a ruthless pursuit. There is nowhere to hide from taxation.',b(){for(let r=4;r<N-4;r+=8)for(let c=4;c<N-4;c+=8)blk(c,r,2,2)}},
{n:'Police Station',c:'#00E5FF',ms:180,d:'Tight corridors, and authority coordinating its pursuit.',b(){for(let r=3;r<N-3;r+=6)for(let c=2;c<N-2;c++)if(c%6)blk(c,r)}},
{n:'Parliament',c:'#E0334C',ms:215,d:'A bewildering labyrinth of political complexity and confusion.',b(){for(let r=2;r<N-2;r+=4)for(let c=2;c<N-2;c+=4){blk(c,r);blk(c+1,r);blk(c,r+1)}for(let r=5;r<N-5;r+=8)for(let c=5;c<N-5;c+=8)blk(c,r,2,2)}},
{n:'Public Sector',c:'#9aa5ff',ms:185,d:'A bureaucratic maze of dead ends and inefficiency.',b(){for(let r=2;r<N-2;r+=3)for(let c=2;c<N-2;c+=5){blk(c,r);if(c+1<N-2)blk(c+1,r)}}},
{n:'The Leviathan',c:'#ff6a00',ms:200,boss:1,d:'The State itself, crowned and hungry. It will not be reasoned with by dots alone.',h:'Eat a glowing Epiphany, then ram The Leviathan while it flees. Five hits. When a red line appears, leave that row or column.',b(){blk(7,9,2,2);blk(21,9,2,2);blk(7,19,2,2);blk(21,19,2,2);blk(14,14,2,2)}}
];
let m,W,PC,pt,left,P={want:1},G=[],B,D2={s:0,t:0},fr=0,chain=0,rdy=0,shake=0,pops=[],boss=0,mute=0,AC,best=0,S={sc:0,lv:0,lives:3,st:'ov',mode:'intro',base:0};
try{best=+localStorage.getItem('pvs')||0}catch(e){}
const wall=(x,y)=>x<0||y<0||x>=N||y>=N||m[y][x]===1;
const pos=e=>{const t=Math.min(1,e.acc/(e.iv||1));return[e.px+(e.x-e.px)*t,e.py+(e.y-e.py)*t]};
function snd(f,d,t='square'){if(mute)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),v=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.value=f;v.gain.setValueAtTime(.04,n);v.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(v);v.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
const pop=(x,y,s)=>pops.push({x,y,s,t:900});
function clr(cx,cy,r){for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if(x>0&&y>0&&x<N-1&&y<N-1)m[y][x]=0}
function build(){
 const L=LV[S.lv];boss=!!L.boss;
 m=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>x*y===0||x===N-1||y===N-1?1:0));
 L.b();clr(14,23,1);clr(14,11,2);
 const k=(x,y)=>y*N+x,seen=new Set([k(14,23)]),q=[[14,23]];
 for(let i=0;i<q.length;i++){const[x,y]=q[i];D.forEach(([a,b])=>{const X=x+a,Y=y+b;if(!wall(X,Y)&&!seen.has(k(X,Y))){seen.add(k(X,Y));q.push([X,Y])}})}
 left=0;
 for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
  if(m[y][x]===1)continue;
  if(!seen.has(k(x,y)))m[y][x]=1;
  else if((Math.abs(x-14)<=2&&Math.abs(y-11)<=2)||(Math.abs(x-14)<=1&&Math.abs(y-23)<=1))m[y][x]=0;
  else{m[y][x]=2;left++}
 }
 PC=[[2,2],[27,2],[2,27],[27,27]].map(([cx,cy])=>{let b=[14,14],d=1e9;for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(m[y][x]===2){const e=(x-cx)**2+(y-cy)**2;if(e<d){d=e;b=[x,y]}}m[b[1]][b[0]]=3;return b});
 pt=[0,0,0,0];
 W=document.createElement('canvas');W.width=W.height=600;const w=W.getContext('2d');
 w.fillStyle='#07080c';w.fillRect(0,0,600,600);
 const gr=w.createRadialGradient(300,300,40,300,300,430);gr.addColorStop(0,L.c+'24');gr.addColorStop(1,'#07080c00');w.fillStyle=gr;w.fillRect(0,0,600,600);
 w.fillStyle='#0d101a';
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x]===1)w.fillRect(x*T,y*T,T,T);
 w.strokeStyle=L.c;w.lineWidth=2;w.shadowColor=L.c;w.shadowBlur=8;w.beginPath();
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x]===1)D.forEach(([a,b])=>{
  if(x+a<0||y+b<0||x+a>=N||y+b>=N||m[y+b][x+a]===1)return;
  const X=x*T+(a>0?T:0),Y=y*T+(b>0?T:0);
  if(a){w.moveTo(X,y*T);w.lineTo(X,y*T+T)}else{w.moveTo(x*T,Y);w.lineTo(x*T+T,Y)}});
 w.stroke();
 if(boss)B={x:14,y:5,px:14,py:5,acc:0,iv:270,hp:5,stun:0};
}
const add=i=>{const[x,y]=[[14,11],[13,11],[15,11],[14,10]][i];G.push({x,y,px:x,py:y,dir:0,acc:0,iv:200,t:TY[i],i,wait:G.length*1500})};
function phase(){if(B.hp<=3&&!G.some(e=>e.i===1))add(1);if(B.hp<=1&&!G.some(e=>e.i===3))add(3)}
function reset(){
 Object.assign(P,{x:14,y:23,px:14,py:23,dir:1,want:1,acc:0,iv:PM});
 G=[];add(0);add(2);
 if(boss){B.x=B.px=14;B.y=B.py=5;B.acc=0;phase()}else{add(1);add(3)}
 fr=0;chain=0;rdy=1500;D2.s=0;D2.t=3500;pops=[];
}
function stepP(){
 P.px=P.x;P.py=P.y;
 if(!wall(P.x+D[P.want][0],P.y+D[P.want][1]))P.dir=P.want;
 const[a,b]=D[P.dir];
 if(!wall(P.x+a,P.y+b)){P.x+=a;P.y+=b;eat()}
}
function eat(){
 const v=m[P.y][P.x];if(v<2)return;m[P.y][P.x]=0;
 if(v===2){S.sc+=10;snd(520,.04)}
 else{S.sc+=50;fr=Math.max(3000,8000-S.lv*900);chain=0;snd(300,.25,'sawtooth');if(boss)pt[PC.findIndex(p=>p[0]===P.x&&p[1]===P.y)]=9000}
 if(!boss&&--left<=0)clearLv();
}
function stepG(e){
 e.px=e.x;e.py=e.y;
 let o=[0,1,2,3].filter(i=>!wall(e.x+D[i][0],e.y+D[i][1]));
 const f=o.filter(i=>i!==(e.dir+2)%4);if(f.length)o=f;
 if(!o.length)return;
 let tx=P.x,ty=P.y,r=[0,.35,.12,0][e.i];
 if(e.i===3){const k=G.find(q=>q.i===0);if(k){tx=2*P.x-k.x;ty=2*P.y-k.y}else{tx+=D[P.dir][0]*4;ty+=D[P.dir][1]*4}}
 let d;
 if(Math.random()<(fr>0?.25:r))d=o[Math.random()*o.length|0];
 else{const s=i=>(e.x+D[i][0]-tx)**2+(e.y+D[i][1]-ty)**2;o.sort((a,b)=>s(a)-s(b));d=fr>0?o[o.length-1]:o[0]}
 e.dir=d;e.x+=D[d][0];e.y+=D[d][1];
}
function stepB(){
 B.px=B.x;B.py=B.y;
 const o=[0,1,2,3].filter(i=>{for(let a=-1;a<2;a++)for(let b=-1;b<2;b++)if(wall(B.x+D[i][0]+a,B.y+D[i][1]+b))return 0;return 1});
 if(!o.length)return;
 const s=i=>(B.x+D[i][0]-P.x)**2+(B.y+D[i][1]-P.y)**2;
 o.sort((a,b)=>s(a)-s(b));
 const d=fr>0?o[o.length-1]:Math.random()<.2?o[o.length*Math.random()|0]:o[0];
 B.x+=D[d][0];B.y+=D[d][1];
}
function hitB(){
 B.hp--;B.stun=2200;fr=0;chain=0;shake=22;S.sc+=1000;snd(90,.5);
 pop(B.x,B.y,'+1000');B.x=B.px=14;B.y=B.py=5;hud();
 if(B.hp<=0){S.sc+=5000;fin();S.st='ov';S.mode='win';show('The Leviathan falls',`Reason outlasts power. Final score ${S.sc}. Best ${best}.`,'Play again');return}
 phase();
}
function die(){
 snd(120,.6,'sawtooth');S.lives--;shake=14;hud();
 if(S.lives<=0){fin();S.st='ov';S.mode='over';show('Caught',`The system caught up with you at ${LV[S.lv].n}. Score ${S.sc}. Best ${best}.`,'Retry level');return}
 reset();
}
function clearLv(){
 S.sc+=100*(S.lv+1);fin();S.st='ov';S.mode='clear';snd(660,.3);
 show('Level cleared',`Bonus ${100*(S.lv+1)} points. Next: ${LV[S.lv+1].n}.`,'Continue');
}
const fin=()=>{if(S.sc>best){best=S.sc;try{localStorage.setItem('pvs',best)}catch(e){}}};
function upd(dt){
 pops.forEach(p=>p.t-=dt);pops=pops.filter(p=>p.t>0);
 if(S.st!=='play')return;
 if(rdy>0){rdy-=dt;return}
 fr=Math.max(0,fr-dt);if(!fr)chain=0;
 P.acc+=dt;while(P.acc>=PM){P.acc-=PM;stepP();if(S.st!=='play')return}
 G.forEach(e=>{if(e.wait>0){e.wait-=dt;return}e.iv=fr>0?340:LV[S.lv].ms*(e.i===1?1.1:1);e.acc+=dt;while(e.acc>=e.iv){e.acc-=e.iv;stepG(e)}});
 if(boss){
  if(B.stun>0)B.stun-=dt;else{B.iv=fr>0?320:B.hp>3?270:B.hp>1?220:180;B.acc+=dt;while(B.acc>=B.iv){B.acc-=B.iv;stepB()}}
  D2.t-=dt;
  if(D2.s===0&&D2.t<=0){D2.s=1;D2.t=1100;D2.v=Math.random()<.5;D2.n=D2.v?P.x:P.y;snd(200,.2,'sawtooth')}
  else if(D2.s===1&&D2.t<=0){D2.s=2;D2.t=260;snd(70,.3,'sawtooth');if((D2.v?P.x:P.y)===D2.n)return die()}
  else if(D2.s===2&&D2.t<=0){D2.s=0;D2.t=B.hp>3?4200:B.hp>1?3200:2400}
  pt.forEach((t,i)=>{if(t>0){pt[i]=t-dt;if(pt[i]<=0){pt[i]=0;m[PC[i][1]][PC[i][0]]=3}}});
 }
 const[a,b]=pos(P);
 for(const e of G){
  if(e.wait>0)continue;const[c,d]=pos(e);
  if(Math.hypot(a-c,b-d)<.7){
   if(fr>0){const s=200*2**Math.min(chain++,3);S.sc+=s;pop(e.x,e.y,'+'+s);snd(700,.15);e.x=e.px=14;e.y=e.py=11;e.wait=2500;e.acc=0}
   else return die();
  }
 }
 if(boss&&B.stun<=0){const[c,d]=pos(B);if(Math.abs(a-c)<1.25&&Math.abs(b-d)<1.25)return fr>0?hitB():die()}
 hud();
}
function ghost(x,y,c,dir,al){
 x=x*T+10;y=y*T+10;g.globalAlpha=al;g.fillStyle=c;g.beginPath();g.arc(x,y-1,8,Math.PI,0);
 g.lineTo(x+8,y+8);g.lineTo(x+4,y+5);g.lineTo(x,y+8);g.lineTo(x-4,y+5);g.lineTo(x-8,y+8);g.closePath();g.fill();
 g.fillStyle='#fff';g.beginPath();g.arc(x-3,y-2,2.4,0,7);g.arc(x+3,y-2,2.4,0,7);g.fill();
 g.fillStyle='#111';g.beginPath();g.arc(x-3+D[dir][0],y-2+D[dir][1],1.2,0,7);g.arc(x+3+D[dir][0],y-2+D[dir][1],1.2,0,7);g.fill();g.globalAlpha=1;
}
function drawB(t){
 const[x,y]=pos(B),cx=x*T+10,cy=y*T+10,v=fr>0&&B.stun<=0;
 if(B.stun>0&&((t/90)|0)%2)g.globalAlpha=.35;
 g.shadowColor=v?'#00E5FF':'#ff6a00';g.shadowBlur=24;
 const gr=g.createRadialGradient(cx,cy-6,4,cx,cy,32);gr.addColorStop(0,v?'#bff8ff':'#ff9a3c');gr.addColorStop(1,v?'#0a5a78':'#5a0c10');
 g.fillStyle=gr;g.beginPath();g.arc(cx,cy,29,0,7);g.fill();g.shadowBlur=0;
 g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1.5;
 for(let r=0;r<3;r++)for(let c=-2;c<3;c++){g.beginPath();g.arc(cx+c*11+(r%2)*5,cy+8+r*8,6,0,Math.PI);g.stroke()}
 g.fillStyle='#C9A84C';g.beginPath();g.moveTo(cx-20,cy-20);
 for(let i=0;i<5;i++){g.lineTo(cx-20+i*10,cy-34);if(i<4)g.lineTo(cx-15+i*10,cy-24)}
 g.lineTo(cx+20,cy-20);g.closePath();g.fill();
 const an=Math.atan2(P.y-y,P.x-x);
 [-9,9].forEach(o=>{g.fillStyle=v?'#fff':'#ffe08a';g.beginPath();g.arc(cx+o,cy-5,5,0,7);g.fill();g.fillStyle='#000';g.beginPath();g.arc(cx+o+Math.cos(an)*2.5,cy-5+Math.sin(an)*2.5,2.4,0,7);g.fill()});
 g.fillStyle='#e8e4d8';for(let i=0;i<5;i++){g.beginPath();g.moveTo(cx-14+i*6,cy+5);g.lineTo(cx-11+i*6,cy+12);g.lineTo(cx-8+i*6,cy+5);g.fill()}
 g.globalAlpha=1;
}
function draw(){
 const t=performance.now();g.save();
 if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0}
 g.drawImage(W,0,0);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const v=m[y][x];
  if(v===2){g.fillStyle='#d9d4c0';g.fillRect(x*T+8,y*T+8,4,4)}
  else if(v===3){g.shadowColor='#00E5FF';g.shadowBlur=14;g.fillStyle='#00E5FF';g.beginPath();g.arc(x*T+10,y*T+10,5.5+Math.sin(t/160)*1.8,0,7);g.fill();g.shadowBlur=0}
 }
 if(boss&&D2.s>0){g.fillStyle=D2.s===1?`rgba(255,77,94,${.14+.1*Math.sin(t/60)})`:'rgba(255,240,200,.85)';D2.v?g.fillRect(D2.n*T,0,T,600):g.fillRect(0,D2.n*T,600,T)}
 const[px,py]=pos(P),cx=px*T+10,cy=py*T+10,mo=.05+.2*Math.abs(Math.sin(t/90)),an=(P.dir-1)*Math.PI/2;
 g.shadowColor='#C9A84C';g.shadowBlur=12;g.fillStyle='#C9A84C';g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,9,an+mo*Math.PI,an+(2-mo)*Math.PI);g.fill();g.shadowBlur=0;
 g.fillStyle='#fff';g.beginPath();g.arc(cx+6,cy-9,2.4,0,7);g.fill();
 G.forEach(e=>{const[x,y]=pos(e);ghost(x,y,fr>0?(fr<2000&&((t/150)|0)%2?'#fff':'#2a46c8'):e.t.c,e.dir,e.wait>0?.35:1)});
 if(boss)drawB(t);
 g.font='bold 14px "DM Mono",monospace';g.textAlign='center';g.fillStyle='#C9A84C';
 pops.forEach(p=>{g.globalAlpha=p.t/900;g.fillText(p.s,p.x*T+10,p.y*T-(900-p.t)/30)});g.globalAlpha=1;
 if(rdy>0){g.fillStyle='#C9A84C';g.font='28px "Bebas Neue",Impact,sans-serif';g.fillText('Ready',300,350)}
 g.restore();
}
function hud(){
 $('sc').textContent=S.sc;$('lv').textContent=`${S.lv+1}/5 ${LV[S.lv].n}`;$('lives').textContent='♥'.repeat(Math.max(0,S.lives));
 $('boss').style.display=boss?'block':'none';if(boss)$('bi').style.width=B.hp*20+'%';
}
function show(h,p,b,s=''){ov.style.display='flex';ov.innerHTML=`<h2>${h}</h2><p>${p}</p>${s?`<small>${s}</small>`:''}<button id="go">${b}</button>`;$('go').onclick=act;$('go').focus()}
function intro(){
 const L=LV[S.lv];S.base=S.sc;build();reset();hud();rdy=0;S.st='ov';S.mode='intro';
 $('help').textContent=L.h||PL;
 show(S.lv?`Level ${S.lv+1}: ${L.n}`:'Philosopher vs The System',(S.lv?'':`Level 1: ${L.n}. `)+L.d,S.lv===4?'Face The Leviathan':'Begin',L.h||`Eat every wisdom dot. Glowing orbs turn the pursuers harmless for a while. Best score ${best}.`);
}
function act(){
 const o=S.mode;
 if(o==='clear'){S.lv++;intro()}
 else if(o==='over'){S.sc=S.base;S.lives=3;intro()}
 else if(o==='win'){S.sc=0;S.lv=0;S.lives=3;intro()}
 else{ov.style.display='none';S.st='play';if(o==='intro')rdy=1500;S.mode=''}
}
const K={ArrowUp:0,w:0,ArrowRight:1,d:1,ArrowDown:2,s:2,ArrowLeft:3,a:3};
addEventListener('keydown',e=>{
 const k=e.key.length>1?e.key:e.key.toLowerCase();
 if(K[k]!==undefined){P.want=K[k];e.preventDefault()}
 else if(k==='p'){if(S.st==='play'){S.st='ov';S.mode='pause';show('Paused','Take a moment to think.','Resume')}else if(S.mode==='pause')act()}
 else if(k==='m')mute=!mute;
 else if((k==='Enter'||k===' ')&&S.st==='ov'&&document.activeElement!==$('go')){e.preventDefault();act()}
});
