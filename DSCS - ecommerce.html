<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSCS Market — Demo Storefront</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.tile{background:var(--st);border:1px solid var(--line);padding:28px 20px;text-align:left;display:flex;flex-direction:column;gap:6px}.tile:hover{border-color:var(--steel)}.tile strong{font:22px Georgia,serif;font-weight:400}

.tb{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.tb select,.tb input{width:auto;min-width:150px}

.fld{margin-bottom:12px}.fld label,legend{display:block;font-weight:600;font-size:13px;margin-bottom:4px}.err{color:var(--err);font-size:13px;margin:3px 0 0;min-height:0}.fld input[aria-invalid=true],.fld select[aria-invalid=true]{border-color:var(--err)}
.co{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:start}.sum{background:#fff;border:1px solid var(--line);padding:20px}.row2{display:flex;justify-content:space-between;gap:12px;padding:4px 0}.row2.big{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}td input[type=number]{width:80px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:50;display:flex;flex-direction:column;padding:18px}
#drawer.open{transform:none;visibility:visible}.dh{display:flex;justify-content:space-between;align-items:center}.dl{flex:1;overflow:auto;margin:10px 0}
.ln{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ln img{width:56px;height:56px}.q{display:flex;gap:8px;align-items:center}.q>button:not(.lnk){width:26px;height:26px;border:1px solid var(--line);background:#fff}
#ov{position:fixed;inset:0;background:rgba(22,32,46,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}#ov[hidden]{display:none}
.dlg{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:24px;position:relative}.dlg.wide{max-width:820px}.dlg h2{padding-right:30px}
.x{position:absolute;top:8px;right:8px;background:none;border:0;font-size:26px;line-height:1;width:36px;height:36px}#drawer .x{position:static}
.qv{display:grid;grid-template-columns:1fr 1fr;gap:20px}.qv>img{width:100%}.rel{margin-top:14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 18px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.hero,.co,.cols,.qv{grid-template-columns:1fr}.hero{padding-top:28px}.menu{display:inline-block}nav{display:none;width:100%;flex-direction:column;order:9}nav.open{display:flex}.sec{padding:30px 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<div class="bar">DEMO STORE · Free standard delivery over £75 · Code WELCOME10 for 10% off</div>
<header><div class="hd">
<button class="brand" data-act="home" aria-label="DSCS Market home">DSCS<b>·</b>Market</button>
<form class="srch" data-form="search" role="search" autocomplete="off"><input id="q" name="q" type="search" placeholder="Search products" aria-label="Search products"><div class="sug" id="sug" hidden></div></form>
<nav id="nav" aria-label="Main"><button data-act="shop">Shop</button><button data-act="nav" data-id="account">Account</button><button data-act="nav" data-id="admin">Admin (demo)</button></nav>
<button class="btn alt" data-act="cart" aria-label="Open basket">Basket (<span id="cnt">0</span>)</button>
<button class="btn alt menu" data-act="menu" aria-expanded="false" aria-controls="nav">Menu</button>
</div></header>
<main id="main" tabindex="-1"></main>
<footer><div class="wrap">
<div><h3 style="color:#fff">DSCS Market</h3><p>A fictional retailer for demonstration. Orders, accounts and inventory live only in this browser.</p></div>
<div><strong>Customer service</strong><button data-act="info" data-id="delivery">Delivery</button><button data-act="info" data-id="returns">Returns</button><button data-act="info" data-id="contact">Contact</button></div>
<div><strong>Company</strong><button data-act="info" data-id="about">About</button><button data-act="info" data-id="privacy">Privacy</button><button data-act="info" data-id="terms">Terms</button><button data-act="info" data-id="demo">Demo limits</button></div>
<div><strong>Demo tools</strong><button data-act="reset">Reset demo data</button></div>
</div></footer>
<aside id="drawer" aria-label="Basket"></aside><div id="ov" hidden></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===== 1. CONFIGURATION & SAMPLE DATA ===== */
const SHIP={std:{n:'Standard (2–4 working days)',p:495},exp:{n:'Express (next working day)',p:995}},FREE_OVER=7500;
const CODES={WELCOME10:{t:'pct',v:10,d:'10% off goods'},SAVE20:{t:'amt',v:2000,min:10000,d:'£20 off orders of £100 or more'},FREESHIP:{t:'ship',d:'Free standard delivery'}};
const CATS=['Audio','Desk','Home','Travel'],COUNTRIES=['United Kingdom','Ireland','France','Germany','United States'];
const STATUS=['Pending','Confirmed','Processing','Dispatched','Delivered'];
const NEXT={Pending:['Confirmed','Cancelled'],Confirmed:['Processing','Cancelled'],Processing:['Dispatched','Cancelled'],Dispatched:['Delivered'],Delivered:[],Cancelled:[]};
/* INTEGRATION POINTS — all null: nothing is connected. A production build needs a trusted backend:
   HOOKS.payment(order) → payment provider; HOOKS.inventory(order) → authoritative stock; HOOKS.email(order) → transactional email; HOOKS.orders(order) → order database. */
const HOOKS={payment:null,inventory:null,email:null,orders:null};
const SEED=[
['p1','Meridian Desk Lamp','Desk',12900,15900,14,4.7,212,'lighting,aluminium',1,0,'Dimmable LED task lamp with a weighted anodised base and counterbalanced arm.'],
['p2','Halden Wireless Headphones','Audio',24900,0,9,4.8,341,'headphones,wireless',1,0,'Closed-back over-ear headphones with 40-hour battery and a neutral studio tuning.'],
['p3','Corvus Mechanical Keyboard','Desk',14900,0,20,4.6,158,'keyboard,tactile',1,1,'Compact 75% keyboard in brushed aluminium with hot-swappable tactile switches.'],
['p4','Tidewell Ceramic Carafe','Home',3800,0,35,4.5,87,'ceramic,kitchen',0,0,'Hand-glazed stoneware carafe with a cork stopper. Holds 900ml.'],
['p5','Argyll Wool Throw','Home',8900,10900,12,4.9,264,'wool,textile',1,0,'Lambswool throw woven in Scotland, finished with a hand-rolled fringe.'],
['p6','Vantage Carry-On','Travel',21900,0,6,4.7,179,'luggage,cabin',1,0,'Cabin-approved hard-shell case with a recessed handle and quiet wheels.'],
['p7','Ferro Pocket Speaker','Audio',7900,0,25,4.4,203,'speaker,portable',0,0,'Palm-sized Bluetooth speaker with a steel grille and 12 hours of playback.'],
['p8','Linden Oak Monitor Riser','Desk',6900,0,4,4.6,96,'oak,storage',0,0,'Solid oak riser with a shallow drawer for cables and small items.'],
['p9','Oriel Travel Organiser','Travel',3400,0,40,4.3,71,'organiser,cotton',0,1,'Waxed-cotton organiser for chargers, passports and everyday carry.'],
['p10','Kestrel Insulated Flask','Home',2800,0,50,4.6,310,'steel,drinks',0,0,'Double-walled steel flask that keeps drinks hot for 12 hours or cold for 24.'],
['p11','Solace Desk Mat','Desk',4500,0,0,4.5,64,'felt,mat',0,1,'Merino felt desk mat in graphite with a stitched edge.'],
['p12','Pennine Packing Cubes','Travel',2900,3500,30,4.4,118,'packing,nylon',0,1,'Set of three lightweight cubes in recycled ripstop nylon.'],
['p13','Quill Studio Earbuds','Audio',14900,0,18,4.5,52,'earbuds,wireless',0,1,'In-ear monitors with active noise cancelling and a compact aluminium case.']
];
const seed=()=>SEED.map(a=>({id:a[0],name:a[1],cat:a[2],price:a[3],was:a[4],stock:a[5],rating:a[6],reviews:a[7],tags:a[8].split(','),feat:!!a[9],isNew:!!a[10],desc:a[11]}));
const INFO={delivery:['Delivery','Standard delivery is £4.95 (free over £75 of goods after discounts) and Express is £9.95. This demo does not generate real shipping labels.'],returns:['Returns','Unused items can be returned within 30 days. This is sample policy text for the demo store.'],contact:['Contact','This fictional store has no live support. A real store would show a monitored email address and phone number here.'],about:['About DSCS Market','We curate durable, well-made essentials for work, home and travel. The brand and products are fictional.'],privacy:['Privacy','Demo data (orders, basket, demo accounts) is stored only in your browser localStorage and is never sent anywhere. Clear it with “Reset demo data”.'],terms:['Terms','Demo terms: no real orders are taken, no payment is processed, and no goods will be shipped.'],demo:['What works locally','Works in-browser: catalogue, basket, discounts, checkout flow, demo accounts, admin and order lifecycle, all saved in localStorage. Needs a real backend: payment, secure sign-in, shared inventory and orders, email, shipping labels.']};
/* ===== 3. LOCAL PERSISTENCE ===== */
const K='dscs.market.v1.';
const store={get(k,d,ok){try{const v=JSON.parse(localStorage.getItem(K+k));return v!==null&&ok(v)?v:d}catch{return d}},set(k,v){try{localStorage.setItem(K+k,JSON.stringify(v))}catch{toast('Browser storage unavailable — changes will not persist.')}}};
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const okProd=p=>isObj(p)&&typeof p.id==='string'&&typeof p.name==='string'&&Number.isInteger(p.price)&&p.price>=0&&Number.isInteger(p.stock)&&p.stock>=0&&Array.isArray(p.tags);
const okOrder=o=>isObj(o)&&typeof o.ref==='string'&&Array.isArray(o.lines)&&Number.isInteger(o.total)&&Array.isArray(o.history);
/* ===== 2. APPLICATION STATE ===== */
const freshCo=()=>({step:1,c:{},d:{country:'United Kingdom',method:'std'},terms:false,err:{},busy:false,done:null});
const S={products:store.get('products',seed(),v=>Array.isArray(v)&&v.length>0&&v.every(okProd)),cart:store.get('cart',{},isObj),
orders:store.get('orders',[],v=>Array.isArray(v)&&v.every(okOrder)),users:store.get('users',[],v=>Array.isArray(v)&&v.every(u=>isObj(u)&&typeof u.email==='string')),
me:store.get('me',null,v=>typeof v==='string'),code:store.get('code','',v=>typeof v==='string'),co:freshCo(),view:'shop',q:'',cat:'All',max:0,sort:'pop',admin:false,tab:'over',aq:'',af:'All'};
const persist=k=>store.set(k,S[k]);
/* ===== 4. CURRENCY & FORMATTING UTILITIES ===== */
const gbp=p=>(p/100).toLocaleString('en-GB',{style:'currency',currency:'GBP'});
const toPence=s=>{s=String(s).trim();if(!/^\d{1,6}(\.\d{1,2})?$/.test(s))return null;const[a,b='']=s.split('.');return +a*100+ +(b+'00').slice(0,2)};
const fmtDate=t=>new Date(t).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
const $=s=>document.querySelector(s);let uid=0;
const h=(t,a,...c)=>{const e=document.createElement(t);for(const k in a||{}){const v=a[k];if(v==null||v===false)continue;k==='class'?e.className=v:e.setAttribute(k,v===true?'':v)}c.flat(9).forEach(x=>{if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x))});return e};
const SH=['<circle cx="200" cy="190" r="90"/>','<rect x="115" y="105" width="170" height="170"/>','<path d="M200 95l95 170H105z"/>'];
const art=p=>{const n=[...p.id].reduce((a,c)=>a*31+c.charCodeAt(0),7),H=(n*47)%360;return'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="hsl(${H},18%,88%)"/><g fill="hsl(${H},28%,36%)">${SH[n%3]}</g><rect x="120" y="318" width="160" height="6" fill="hsl(${H},28%,26%)"/></svg>`)};
const meta=p=>(p.reviews?`★ ${p.rating} (${p.reviews}) · `:'New · ')+(p.stock<1?'Out of stock':p.stock<=5?`Only ${p.stock} left`:'In stock');
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)};
/* ===== 5. PRODUCT CATALOGUE LOGIC ===== */
const prod=id=>S.products.find(p=>p.id===id);
const visible=()=>{const q=S.q.toLowerCase(),s={pop:(a,b)=>b.reviews-a.reviews,lo:(a,b)=>a.price-b.price,hi:(a,b)=>b.price-a.price,az:(a,b)=>a.name.localeCompare(b.name)}[S.sort];
return S.products.filter(p=>(S.cat==='All'||p.cat===S.cat)&&(!S.max||p.price<=S.max)&&(!q||[p.name,p.cat,p.desc,...p.tags].join(' ').toLowerCase().includes(q))).sort(s)};
/* ===== 6. BASKET & DISCOUNT LOGIC (integer pence) ===== */
const calc=(method=S.co.d.method)=>{const lines=Object.keys(S.cart).map(id=>{const p=prod(id);return{p,q:p?Math.min(S.cart[id],p.stock):0}}).filter(l=>l.p&&l.q>0);
const sub=lines.reduce((a,l)=>a+l.p.price*l.q,0),c=CODES[S.code];let disc=0;
if(c&&c.t==='pct')disc=Math.round(sub*c.v/100);if(c&&c.t==='amt'&&sub>=c.min)disc=Math.min(c.v,sub);
let ship=lines.length?(SHIP[method]||SHIP.std).p:0;if(lines.length&&method!=='exp'&&(sub-disc>=FREE_OVER||(c&&c.t==='ship')))ship=0;
return{lines,sub,disc,ship,total:sub-disc+ship,count:lines.reduce((a,l)=>a+l.q,0)}};
const addCart=(id,n=1)=>{const p=prod(id);if(!p||p.stock<1)return toast('Sorry, that item is out of stock.');const cur=S.cart[id]||0,nx=Math.min(cur+n,p.stock);S.cart[id]=nx;persist('cart');
toast(nx<cur+n?`Only ${p.stock} available — basket set to ${nx}.`:`Added ${p.name} to your basket.`);chrome()};
const setQty=(id,n)=>{const p=prod(id);if(!p||n<=0)delete S.cart[id];else S.cart[id]=Math.min(n,p.stock);persist('cart');S.view==='checkout'?render():chrome()};
const applyCode=raw=>{const c=raw.trim().toUpperCase(),r=CODES[c];if(!c)return'Enter a discount code.';if(!r)return'That code is not recognised.';if(r.t==='amt'&&calc().sub<r.min)return'This code needs £100 or more of goods.';S.code=c;persist('code');return''};
/* ===== 7. CHECKOUT & VALIDATION ===== */
const RE={email:/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/,post:/^[A-Za-z]{1,2}\d[A-Za-z\d]?\s?\d[A-Za-z]{2}$/,tel:/^[+\d][\d\s()-]{6,18}$/};
const validate=step=>{const e={},c=S.co.c,d=S.co.d;
if(step===1){if(!RE.email.test((c.email||'').trim()))e.email='Enter a valid email address.';if(!(c.name||'').trim())e.name='Enter your full name.';if(c.phone&&!RE.tel.test(c.phone.trim()))e.phone='Enter a valid number or leave this blank.'}
if(step===2){if(!(d.addr||'').trim())e.addr='Enter your street address.';if(!(d.city||'').trim())e.city='Enter your town or city.';
if(d.country==='United Kingdom'?!RE.post.test((d.post||'').trim()):!(d.post||'').trim())e.post=d.country==='United Kingdom'?'Enter a valid UK postcode, e.g. SW1A 1AA.':'Enter a postal code.';
if(!COUNTRIES.includes(d.country))e.country='Select a country.';if(!SHIP[d.method])e.method='Choose a delivery method.'}
if(step===3&&!S.co.terms)e.terms='Please acknowledge the demo terms to continue.';return e};
const mkRef=()=>{let r;do{r='DSCS-'+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).toUpperCase().slice(2,5)}while(S.orders.some(o=>o.ref===r));return r};
const placeOrder=()=>{const C=S.co;if(C.busy||C.done)return;C.busy=true;const t=calc();
if(!t.lines.length){C.busy=false;return toast('Your basket is empty.')}

clear(){S.q='';S.cat='All';S.max=0;render();scrollShop()},clearq(){S.q='';render();scrollShop()},signout(){S.me=null;persist('me');render();toast('Signed out.')},
order(ref){const o=S.orders.find(x=>x.ref===ref);o&&modal('Order '+o.ref,orderView(o,S.admin&&S.view==='admin'),true)},setStatus(ref,_,el){setStatus(ref,el.dataset.s)},
enterAdmin(){S.admin=true;render()},exitAdmin(){S.admin=false;render()},tab(id){S.tab=id;S.aq='';S.af='All';render()},newP(){modal('Add product',prodForm())},editP(id){const p=prod(id);p&&modal('Edit '+p.name,prodForm(p))},
delP(id){const p=prod(id);p&&ask(`Delete “${p.name}”? Past orders keep their saved snapshot.`,'Delete product',()=>{S.products=S.products.filter(x=>x.id!==id);delete S.cart[id];persist('products');persist('cart');toast('Product deleted.');render()})},
yes(){const f=pending;closeModal();f&&f()},
reset(){ask('Reset all demo data? This clears the basket, orders, accounts and product edits stored in this browser.','Reset',()=>{try{Object.keys(localStorage).filter(k=>k.startsWith(K)).forEach(k=>localStorage.removeItem(k))}catch{}
Object.assign(S,{products:seed(),cart:{},orders:[],users:[],me:null,code:'',co:freshCo(),admin:false,cat:'All',q:'',max:0,sort:'pop',tab:'over'});closeDrawer();go('shop');toast('Demo data reset.')})}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act]){e.preventDefault();A[el.dataset.act](el.dataset.id,undefined,el)}});
document.addEventListener('pointerdown',e=>{if($('#drawer').classList.contains('open')&&!e.target.closest('#drawer,[data-act=cart],#ov'))closeDrawer();if(e.target===$('#ov'))closeModal();if(!e.target.closest('.srch'))$('#sug').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#ov').hidden)closeModal();else if($('#drawer').classList.contains('open'))closeDrawer();$('#sug').hidden=true}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;if(el.type==='checkbox'){S.co.terms=el.checked;return}const[g,n]=k.split('.');S.co[g][n]=el.value});
document.addEventListener('change',e=>{const el=e.target;
if(el.dataset.f){S[el.dataset.f]=el.dataset.f==='max'?Number(el.value):el.value;$('#grid').replaceChildren(grid(visible()))}
else if(el.dataset.k==='d.method')updSum();
else if(el.dataset.stock){const p=prod(el.dataset.stock),n=Number(el.value);if(p&&el.value!==''&&Number.isInteger(n)&&n>=0){p.stock=n;persist('products');toast('Stock updated.')}else{if(p)el.value=p.stock;toast('Enter a whole number, 0 or more.')}}});
$('#q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase(),s=$('#sug');if(!v){s.hidden=true;return}
const m=S.products.filter(p=>(p.name+' '+p.tags.join(' ')+' '+p.cat).toLowerCase().includes(v)).slice(0,5);
s.replaceChildren(...(m.length>0?m.map(p=>h('button',{type:'button','data-act':'quick','data-id':p.id},h('img',{src:art(p),alt:''}),p.name+' — '+gbp(p.price))):[h('p',{class:'empty sm'},'No matches for “'+e.target.value.trim()+'”.')]));s.hidden=false});
const FORMS={search(d){S.q=(d.q||'').trim();S.cat='All';$('#sug').hidden=true;go('shop',scrollShop)},
code(d,f){const m=applyCode(d.code||'');m?setErrs(f,{code:m}):(toast('Discount code applied.'),chrome())},
news(d,f){RE.email.test((d.email||'').trim())?(toast('Thanks — demo only, nothing was stored or sent.'),f.reset(),setErrs(f,{})):setErrs(f,{email:'Enter a valid email address.'})},
step(){const C=S.co,e=validate(C.step);C.err=e;if(Object.keys(e).length>0){render();$('[aria-invalid=true]')?.focus();return}if(C.step===3)return placeOrder();C.step++;render();scrollTo(0,0)},
signin(d,f){const u=S.users.find(x=>x.email===(d.email||'').trim().toLowerCase());if(!RE.email.test((d.email||'').trim()))return setErrs(f,{email:'Enter a valid email address.'});if(!u)return setErrs(f,{email:'No demo account with that email. Register first.'});S.me=u.email;persist('me');render();toast('Signed in (demo).')},
register(d,f){const e={},em=(d.email||'').trim().toLowerCase();if(!(d.name||'').trim())e.name='Enter your name.';if(!RE.email.test(em))e.email='Enter a valid email address.';else if(S.users.some(u=>u.email===em))e.email='That email is already registered here.';setErrs(f,e);if(Object.keys(e).length)return;
S.users.push({email:em,name:d.name.trim(),addr:'',city:'',post:'',country:'United Kingdom'});S.me=em;persist('users');persist('me');render();toast('Demo account created.')},
profile(d){const u=me();if(!u)return;['addr','city','post','country'].forEach(k=>{u[k]=(d[k]||'').trim()});persist('users');toast('Delivery details saved.')},
afilter(d){S.aq=(d.q||'').trim();if(d.f)S.af=d.f;render()},
prod(d,f){const e={},id=f.dataset.id,price=toPence(d.price),was=d.was&&d.was.trim()?toPence(d.was):0,stock=Number(d.stock);
if(!d.name.trim())e.name='Enter a product name.';if(price===null||price<1)e.price='Enter a price such as 49.00.';if(was===null)e.was='Enter a valid price or leave blank.';if(d.stock.trim()===''||!Number.isInteger(stock)||stock<0)e.stock='Enter a whole number, 0 or more.';if(!d.desc.trim())e.desc='Enter a description.';
setErrs(f,e);if(Object.keys(e).length)return;const tags=d.tags.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean),v={name:d.name.trim(),cat:d.cat,price,was,stock,desc:d.desc.trim(),tags};
if(id&&prod(id))Object.assign(prod(id),v);else S.products.push({id:'p'+Date.now().toString(36),rating:0,reviews:0,feat:false,isNew:true,...v});
persist('products');closeModal();toast('Product saved.');render()}};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();FORMS[f.dataset.form]&&FORMS[f.dataset.form](Object.fromEntries(new FormData(f)),f)});
